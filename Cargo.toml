[package]
name = "officetab_rs"
version = "0.1.0"
edition = "2024"
authors = ["Washington"]
description = "Office Tab Pro reimplementation in Rust - COM Add-in with window subclassing"

[lib]
name = "officetab_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Diagnostics",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }
windows-core = "0.58"
